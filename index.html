<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>がんばりスケジュール</title>
<style>
  :root {
    --bg: #f4f4f3;
    --card: #ffffff;
    --ink: #1f1f1e;
    --ink-soft: #4a4a48;
    --muted: #96968f;
    --line: #e8e8e5;
    --accent: #222220;
    --green: #6cb44c;
    --green-soft: #eef6e9;
    --gold: #e8a820;
    --gold-soft: #fdf3dd;
    --danger: #d05c5c;
    --shadow: 0 1px 2px rgba(20, 20, 18, 0.05), 0 4px 14px rgba(20, 20, 18, 0.06);
    --shadow-press: 0 1px 3px rgba(20, 20, 18, 0.08);
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--ink);
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  button { font-family: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  .app {
    max-width: 760px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px 16px 112px;
  }

  /* ===== ヘッダー（キャラクター） ===== */
  .header {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .chara-wrap {
    flex-shrink: 0;
    width: 152px;
    height: 152px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8f5f0;
    border: 1px solid var(--line);
    border-radius: 50%;
    overflow: hidden;
  }
  .chara {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.04);
    transform-origin: center;
    transition: transform 0.3s;
  }
  .chara.egg-fit { transform: scale(0.96); }
  .chara.happy { animation: bounce 0.6s ease 2; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-12px) scale(1.05); }
    60% { transform: translateY(0) scale(0.97); }
  }
  .speech { flex: 1; min-width: 0; }
  .speech-text {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  .level-tag {
    display: inline-block;
    background: var(--gold-soft);
    color: #9a6c08;
    border-radius: 999px;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 12px;
    margin-top: 8px;
    letter-spacing: 0.03em;
  }

  /* ===== スター表示 ===== */
  .star-bar {
    margin-top: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .star-count {
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: baseline;
    gap: 5px;
    white-space: nowrap;
  }
  .star-count .num { font-size: 26px; color: var(--gold); }
  .level-progress { flex: 1; }
  .level-progress .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: bold; }
  .bar-outer {
    height: 10px;
    background: #ececea;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-inner {
    height: 100%;
    background: var(--gold);
    border-radius: 999px;
    width: 0%;
    transition: width 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  .gallery-btn {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 21px;
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .gallery-btn:active { transform: scale(0.92); }

  /* あたらしい たまごへ すすむ バナー */
  .new-egg-banner {
    display: none;
    margin-top: 12px;
    background: var(--gold-soft);
    border: 1px solid #ecd8a0;
    border-radius: var(--radius);
    padding: 14px 16px;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .new-egg-banner.show { display: flex; }
  .new-egg-banner span { font-size: 14px; font-weight: bold; color: #8a6408; }
  .new-egg-banner button {
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    border-radius: 999px;
    padding: 10px 18px;
    box-shadow: 0 4px 10px rgba(20, 20, 18, 0.22);
    white-space: nowrap;
  }
  .new-egg-banner button:active { transform: scale(0.96); }

  /* ===== 日にち選択 ===== */
  .date-nav {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-arrow {
    width: 48px;
    height: 60px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    font-size: 16px;
    color: var(--muted);
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .date-arrow:active { transform: scale(0.94); box-shadow: var(--shadow-press); }
  .week-strip {
    flex: 1;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 2px;
  }
  .week-strip::-webkit-scrollbar { display: none; }
  .day-chip {
    flex: 1;
    min-width: 56px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 9px 4px 6px;
    text-align: center;
    transition: transform 0.15s;
  }
  .day-chip .dow { font-size: 11px; color: var(--muted); font-weight: bold; }
  .day-chip .dnum { font-size: 20px; font-weight: bold; margin-top: 1px; }
  .day-chip .dot { font-size: 9px; height: 14px; line-height: 14px; }
  .day-chip.selected {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.04);
  }
  .day-chip.selected .dow, .day-chip.selected .dnum { color: #fff; }
  .day-chip.today:not(.selected) { border-color: var(--ink-soft); }
  .day-chip.sat:not(.selected) .dow { color: #5b8db8; }
  .day-chip.sun:not(.selected) .dow { color: #c96f6f; }

  /* ===== 今日の見出し ===== */
  .day-heading {
    margin-top: 22px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 4px;
  }
  .day-heading h2 { font-size: 18px; letter-spacing: 0.02em; }
  .day-heading .done-count { font-size: 13px; color: var(--muted); font-weight: bold; }

  .day-progress { margin-top: 10px; padding: 0 4px; }
  .day-progress .bar-outer { height: 8px; }
  .day-progress .bar-inner { background: var(--green); }

  /* ===== タスクリスト ===== */
  .task-list {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .task-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    animation: slidein 0.3s ease;
    position: relative;
  }
  @keyframes slidein {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task-card.done { background: #fafaf9; }
  .task-card.done .task-name { text-decoration: line-through; color: var(--muted); }
  .task-card.done .task-icon { opacity: 0.5; }
  .task-icon {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    flex-shrink: 0;
  }
  .task-info { flex: 1; min-width: 0; }
  .task-time {
    font-size: 12px;
    font-weight: bold;
    color: var(--ink-soft);
    background: var(--bg);
    border: 1px solid var(--line);
    display: inline-block;
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 5px;
  }
  .task-time.no-time { color: var(--muted); }
  .task-name { font-size: 17px; font-weight: bold; word-break: break-word; line-height: 1.4; }
  .check-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--card);
    border: 2px dashed #d4d4d0;
    font-size: 26px;
    flex-shrink: 0;
    transition: transform 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check-btn:active { transform: scale(0.9); border-color: var(--green); }
  .task-card.done .check-btn {
    background: var(--green-soft);
    border: 2px solid var(--green);
    animation: pop 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop {
    0% { transform: scale(0.4); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .del-btn {
    position: absolute;
    top: -8px;
    right: -6px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--danger);
    font-size: 14px;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
  }
  body.edit-mode .del-btn { display: flex; }
  body.edit-mode .task-card { animation: wiggle 0.4s infinite; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(0.5deg); }
    75% { transform: rotate(-0.5deg); }
  }

  /* さいしょから やりなおす（おとな向け。へんしゅうモード中だけ表示） */
  .reset-zone { display: none; margin-top: 32px; text-align: center; }
  body.edit-mode .reset-zone { display: block; }
  #reset-btn {
    background: none;
    border: 1.5px dashed var(--danger);
    color: var(--danger);
    font-size: 12px;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 999px;
  }

  .empty-msg {
    text-align: center;
    padding: 44px 20px;
    color: var(--muted);
    font-size: 15px;
    font-weight: bold;
    line-height: 2;
  }
  .empty-msg .big { font-size: 40px; }

  /* ===== 下部ボタン ===== */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    pointer-events: none;
  }
  .bottom-bar > * { pointer-events: auto; }
  .add-btn {
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    border-radius: 999px;
    padding: 16px 36px;
    box-shadow: 0 6px 16px rgba(20, 20, 18, 0.28);
    transition: transform 0.15s;
    letter-spacing: 0.03em;
  }
  .add-btn:active { transform: scale(0.96); }
  .edit-btn {
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 14px;
    font-weight: bold;
    border-radius: 999px;
    padding: 16px 20px;
    box-shadow: var(--shadow);
    color: var(--muted);
  }
  body.edit-mode .edit-btn { background: var(--ink-soft); border-color: var(--ink-soft); color: #fff; }

  /* ===== モーダル ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(31, 31, 30, 0.5);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    width: 100%;
    max-width: 760px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 24px 24px 0 0;
    padding: 22px 20px calc(26px + env(safe-area-inset-bottom));
    animation: slideup 0.3s cubic-bezier(.34,1.3,.64,1);
  }
  @keyframes slideup {
    from { transform: translateY(60%); }
    to { transform: translateY(0); }
  }
  .modal h3 { font-size: 18px; text-align: center; margin-bottom: 6px; letter-spacing: 0.04em; }
  .modal-handle {
    width: 40px;
    height: 4px;
    background: #d8d8d4;
    border-radius: 999px;
    margin: 0 auto 16px;
  }
  .form-label {
    font-size: 13px;
    font-weight: bold;
    color: var(--ink-soft);
    margin: 18px 0 8px;
    display: block;
    letter-spacing: 0.03em;
  }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: bold;
    box-shadow: var(--shadow);
  }
  .chip.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
  .chip-del {
    display: inline-block;
    margin-left: 8px;
    color: var(--danger);
    font-size: 13px;
    padding: 2px 4px;
  }
  .chip.selected .chip-del { color: #fff; }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
    gap: 8px;
  }
  .icon-choice {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    font-size: 28px;
    padding: 10px 0 5px;
    text-align: center;
  }
  .icon-choice .icon-label { font-size: 10px; color: var(--muted); display: block; font-weight: bold; }
  .icon-choice.selected { border: 2px solid var(--accent); background: #f7f7f5; }
  .text-input, .time-input, .date-input {
    width: 100%;
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    outline: none;
  }
  .text-input:focus, .time-input:focus, .date-input:focus { border-color: var(--accent); }
  .time-row { display: flex; gap: 8px; align-items: center; }
  .time-row .time-input { flex: 1; }
  .time-clear {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 13px 14px;
    font-size: 13px;
    font-weight: bold;
    color: var(--muted);
    white-space: nowrap;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 26px; }
  .btn-cancel {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
    color: var(--muted);
    box-shadow: var(--shadow);
  }
  .btn-save {
    flex: 2;
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 6px 16px rgba(20, 20, 18, 0.28);
    letter-spacing: 0.03em;
  }
  .btn-save:active { transform: scale(0.97); }
  .btn-save:disabled { opacity: 0.4; }

  /* ===== おいわい ===== */
  .celebrate-overlay {
    position: fixed;
    inset: 0;
    background: rgba(250, 250, 249, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    padding: 24px;
  }
  .celebrate-overlay.open { display: flex; }
  .celebrate-chara {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: #f8f5f0;
    border: 1px solid var(--line);
    object-fit: cover;
    animation: bounce 0.7s ease infinite;
  }
  .celebrate-title { font-size: 30px; font-weight: bold; letter-spacing: 0.05em; }
  .celebrate-sub { font-size: 16px; font-weight: bold; line-height: 1.9; color: var(--ink-soft); }
  .celebrate-close {
    margin-top: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    border-radius: 999px;
    padding: 15px 44px;
    box-shadow: 0 6px 16px rgba(20, 20, 18, 0.28);
  }

  /* レベルアップ */
  .levelup-img {
    width: min(72vw, 330px);
    aspect-ratio: 1;
    border-radius: 28px;
    border: 1px solid var(--line);
    background: #f8f5f0;
    object-fit: cover;
    animation: pop 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .levelup-name {
    font-size: 22px;
    font-weight: bold;
    background: var(--gold-soft);
    color: #9a6c08;
    border-radius: 999px;
    padding: 6px 22px;
  }

  /* たまごえらび／そだてた ずかん */
  .egg-overlay, .gallery-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 24px;
    text-align: center;
    overflow-y: auto;
  }
  .egg-overlay.open, .gallery-overlay.open { display: flex; }
  .egg-overlay h3, .gallery-overlay h3 { font-size: 22px; letter-spacing: 0.04em; }
  .egg-lead { font-size: 14px; color: var(--muted); font-weight: bold; margin-bottom: 16px; line-height: 1.8; }
  .egg-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    max-width: 560px;
  }
  .egg-choice {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 14px 10px 12px;
    width: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: transform 0.15s;
    position: relative;
  }
  .egg-choice:active { transform: scale(0.94); }
  .egg-choice svg { width: 104px; height: 104px; }
  .egg-name { font-size: 14px; font-weight: bold; }
  .egg-done-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--green);
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    border-radius: 999px;
    padding: 2px 8px;
  }

  /* そだてた ずかん の なかみ */
  .gallery-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 620px;
    margin-bottom: 20px;
  }
  .gallery-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 14px;
    text-align: left;
  }
  .gallery-card-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; }
  .gallery-stages {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .gallery-stage { flex-shrink: 0; width: 84px; text-align: center; }
  .gallery-stage img {
    width: 84px;
    height: 84px;
    border-radius: 14px;
    object-fit: cover;
    background: #f8f5f0;
    border: 1px solid var(--line);
  }
  .gallery-stage span {
    display: block;
    font-size: 10px;
    color: var(--muted);
    font-weight: bold;
    margin-top: 4px;
  }
  .gallery-empty {
    color: var(--muted);
    font-size: 14px;
    font-weight: bold;
    line-height: 2;
    margin-bottom: 20px;
  }

  /* ===== タイマー ===== */
  .timer-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    overflow-y: auto;
  }
  .timer-overlay.open { display: flex; }
  .timer-overlay h3 { font-size: 22px; letter-spacing: 0.04em; }
  .timer-clock {
    position: relative;
    width: min(66vw, 300px);
    aspect-ratio: 1;
  }
  .timer-clock svg { width: 100%; height: 100%; transform: rotate(0deg); }
  .timer-track { fill: #ececea; stroke: var(--line); stroke-width: 1; }
  .timer-pie { fill: var(--gold); transition: fill 0.3s; }
  .timer-pie.warn { fill: #f0894c; }
  .timer-hub { fill: var(--ink-soft); }
  .timer-digit {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 20%;
    font-size: 40px;
    font-weight: bold;
    color: var(--ink);
    letter-spacing: 0.04em;
    text-shadow: 0 1px 0 #fff, 0 0 8px #fff;
  }
  .timer-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 340px;
  }
  .timer-preset {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--shadow);
    padding: 10px 18px;
    font-size: 16px;
    font-weight: bold;
  }
  .timer-preset.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .timer-controls { display: flex; gap: 12px; }
  .timer-ctrl {
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 17px;
    font-weight: bold;
  }
  .timer-reset {
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    color: var(--muted);
  }
  .timer-start {
    background: var(--green);
    color: #fff;
    box-shadow: 0 5px 14px rgba(108, 180, 76, 0.4);
    min-width: 140px;
  }
  .timer-start.running { background: var(--gold); box-shadow: 0 5px 14px rgba(232, 168, 32, 0.4); }
  .timer-ctrl:active { transform: scale(0.96); }

  /* 紙吹雪 */
  .confetti {
    position: fixed;
    top: -20px;
    font-size: 22px;
    z-index: 99;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }

  /* +1 ほし */
  .fly-star {
    position: fixed;
    font-size: 26px;
    font-weight: bold;
    color: var(--gold);
    z-index: 99;
    pointer-events: none;
    animation: flyup 0.9s ease forwards;
  }
  @keyframes flyup {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to { transform: translateY(-90px) scale(1.4); opacity: 0; }
  }

  @media (min-width: 600px) {
    .chara-wrap { width: 188px; height: 188px; }
    .speech-text { font-size: 17px; }
    .task-name { font-size: 19px; }
  }
</style>

<body>

<div class="app">
  <!-- キャラクター -->
  <div class="header">
    <div class="chara-wrap"><img id="chara" class="chara" alt="ヤモちゃん"></div>
    <div class="speech">
      <div class="speech-text" id="speech-text">きょうも いっしょに がんばろう！</div>
      <span class="level-tag" id="level-tag">レベル1 たまごヤモ</span>
    </div>
  </div>

  <!-- ほし＆レベル -->
  <div class="star-bar">
    <div class="star-count">⭐ <span class="num" id="star-num">0</span> こ</div>
    <div class="level-progress">
      <div class="label" id="level-label">つぎのレベルまで あと 5こ</div>
      <div class="bar-outer"><div class="bar-inner" id="level-bar"></div></div>
    </div>
    <button class="gallery-btn" id="timer-btn" aria-label="タイマー">⏰</button>
    <button class="gallery-btn" id="gallery-btn" aria-label="そだてた ずかん">📖</button>
  </div>

  <!-- さいごまで そだてたら あたらしい たまごへ -->
  <div class="new-egg-banner" id="new-egg-banner">
    <span>🎉 さいごまで そだてたね！</span>
    <button id="new-egg-btn">🥚 あたらしい たまごを えらぶ</button>
  </div>

  <!-- 日にちナビ -->
  <div class="date-nav">
    <button class="date-arrow" id="prev-week" aria-label="まえのしゅう">◀</button>
    <div class="week-strip" id="week-strip"></div>
    <button class="date-arrow" id="next-week" aria-label="つぎのしゅう">▶</button>
  </div>

  <!-- 見出し＆きょうのすすみぐあい -->
  <div class="day-heading">
    <h2 id="day-title">きょうの かだい</h2>
    <span class="done-count" id="done-count"></span>
  </div>
  <div class="day-progress">
    <div class="bar-outer"><div class="bar-inner" id="day-bar"></div></div>
  </div>

  <!-- かだいリスト -->
  <div class="task-list" id="task-list"></div>

  <!-- リセット（へんしゅうモードのときだけ ひょうじ） -->
  <div class="reset-zone">
    <button id="reset-btn">🔄 さいしょから やりなおす（ぜんぶ けす）</button>
  </div>
</div>

<!-- 下部ボタン -->
<div class="bottom-bar">
  <button class="edit-btn" id="edit-btn">✏️ へんしゅう</button>
  <button class="add-btn" id="add-btn">＋ かだいを ふやす</button>
</div>

<!-- 追加モーダル -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>あたらしい かだい</h3>

    <label class="form-label">① なにを やる？（えらんでね）</label>
    <div class="chip-grid" id="preset-chips"></div>

    <label class="form-label">じぶんで かくときは ここ ✍️</label>
    <input type="text" class="text-input" id="task-name-input" maxlength="30" placeholder="れい：かんじドリル 2ページ">

    <label class="form-label">② マークを えらぼう</label>
    <div class="icon-grid" id="icon-grid"></div>

    <label class="form-label">③ いつ やる？</label>
    <input type="date" class="date-input" id="task-date-input">

    <label class="form-label">④ なんじから？（なくても OK）</label>
    <div class="time-row">
      <input type="time" class="time-input" id="task-time-input">
      <button class="time-clear" id="time-clear">じかんなし</button>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">やめる</button>
      <button class="btn-save" id="btn-save">これで きめた！</button>
    </div>
  </div>
</div>

<!-- レベルアップ おいわい -->
<div class="celebrate-overlay" id="levelup-overlay">
  <img class="levelup-img" id="levelup-img" alt="せいちょうした ヤモちゃん">
  <div class="celebrate-title">✨ レベルアップ！ ✨</div>
  <div class="levelup-name" id="levelup-name"></div>
  <div class="celebrate-sub" id="levelup-sub"></div>
  <button class="celebrate-close" id="levelup-close">やったー！</button>
</div>

<!-- たまごえらび（さいしょの1かい／あたらしく そだてるとき） -->
<div class="egg-overlay" id="egg-overlay">
  <h3>すきな たまごを えらんでね</h3>
  <div class="egg-lead">かだいを クリアして ほしを あつめると<br>たまごから かわいい いきものが うまれて そだつよ！</div>
  <div class="egg-grid" id="egg-grid"></div>
</div>

<!-- そだてた ずかん -->
<div class="gallery-overlay" id="gallery-overlay">
  <h3>そだてた ずかん</h3>
  <div class="egg-lead">さいごまで そだてた いきものが ここに ならぶよ！</div>
  <div class="gallery-list" id="gallery-list"></div>
  <button class="celebrate-close" id="gallery-close">とじる</button>
</div>

<!-- タイマー -->
<div class="timer-overlay" id="timer-overlay">
  <h3>タイマー</h3>
  <div class="timer-clock">
    <svg viewBox="0 0 120 120" id="timer-svg">
      <circle cx="60" cy="60" r="54" class="timer-track"/>
      <path id="timer-pie" class="timer-pie" d=""/>
      <circle cx="60" cy="60" r="4" class="timer-hub"/>
    </svg>
    <div class="timer-digit" id="timer-digit">5:00</div>
  </div>
  <div class="timer-presets" id="timer-presets"></div>
  <div class="timer-controls">
    <button class="timer-ctrl timer-reset" id="timer-reset">やりなおし</button>
    <button class="timer-ctrl timer-start" id="timer-start">スタート</button>
  </div>
  <button class="celebrate-close" id="timer-close">とじる</button>
</div>

<!-- ぜんぶできた おいわい -->
<div class="celebrate-overlay" id="celebrate-overlay">
  <img class="celebrate-chara" id="celebrate-chara" alt="ヤモちゃん">
  <div class="celebrate-title" id="celebrate-title">🎉 ぜんぶ できた！ 🎉</div>
  <div class="celebrate-sub" id="celebrate-sub">きょうの かだいを ぜんぶ クリア！<br>すごい！ えらい！ かっこいい！</div>
  <button class="celebrate-close" id="celebrate-close">やったー！</button>
</div>

const STORE_KEY = "studyschedule-v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* こわれたデータは無視 */ }
  return { tasks: [], stars: 0, celebratedDates: [] };
}
function saveState() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
const state = loadState();
if (!Array.isArray(state.tasks)) state.tasks = [];

  return `${y}-${m}-${dd}`;
}

  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);

/* ================= たまご =================
   ここに 1行 たすだけで たまごの しゅるいを ふやせます。
   deco: "spots" | "stripes" | "zigzag" | "hearts" | "stars" | "none" */
const EGGS = [
  { id: "shiro",  name: "しろたまご",   base: "#f2ede3", deco: "spots",   decoColor: "#d5cbba", species: "yamori" },
  { id: "sakura", name: "さくらたまご", base: "#f7e0e5", deco: "hearts",  decoColor: "#dfa3af", species: "tangerine" },
  { id: "sora",   name: "そらたまご",   base: "#dde9f2", deco: "stripes", decoColor: "#a5c3d9", species: "seaturtle" },
  { id: "wakaba", name: "わかばたまご", base: "#e3efdb", deco: "zigzag",  decoColor: "#a9c795", species: "snake" },
  { id: "hoshi",  name: "ほしたまご",   base: "#f5edd2", deco: "stars",   decoColor: "#d9b95c", species: "highyellow" },
];

function eggSVG(egg) {
  const c = egg.decoColor;
  let deco = "";
  if (egg.deco === "spots") {
    deco = `<circle cx="47" cy="52" r="5" fill="${c}"/><circle cx="74" cy="44" r="4" fill="${c}"/>
      <circle cx="66" cy="72" r="6" fill="${c}"/><circle cx="44" cy="82" r="4" fill="${c}"/>
      <circle cx="78" cy="90" r="4.5" fill="${c}"/>`;
  } else if (egg.deco === "stripes") {
    deco = `<path d="M29 60 Q60 50 91 60" stroke="${c}" stroke-width="6" fill="none"/>
      <path d="M31 82 Q60 72 89 82" stroke="${c}" stroke-width="6" fill="none"/>`;
  } else if (egg.deco === "zigzag") {
    deco = `<path d="M31 64 L41 56 L51 64 L61 56 L71 64 L81 56 L89 62" stroke="${c}" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M34 88 L44 80 L54 88 L64 80 L74 88 L84 81" stroke="${c}" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else if (egg.deco === "hearts") {
    deco = `<path d="M52 54 a5 5 0 0 1 8 0 a5 5 0 0 1 8 0 q0 6 -8 12 q-8 -6 -8 -12" fill="${c}"/>
      <path d="M40 80 a3.5 3.5 0 0 1 5.5 0 a3.5 3.5 0 0 1 5.5 0 q0 4 -5.5 8.5 q-5.5 -4.5 -5.5 -8.5" fill="${c}"/>
      <path d="M68 84 a3 3 0 0 1 5 0 a3 3 0 0 1 5 0 q0 4 -5 7.5 q-5 -3.5 -5 -7.5" fill="${c}"/>`;
  } else if (egg.deco === "stars") {
    deco = `<path d="M60 44 l2.8 6.4 6.8 .5 -5.2 4.6 1.6 6.6 -6 -3.6 -6 3.6 1.6 -6.6 -5.2 -4.6 6.8 -.5 Z" fill="${c}"/>
      <path d="M44 76 l1.8 4.2 4.4 .4 -3.4 3 1 4.3 -3.8 -2.4 -3.8 2.4 1 -4.3 -3.4 -3 4.4 -.4 Z" fill="${c}"/>
      <path d="M76 82 l1.8 4.2 4.4 .4 -3.4 3 1 4.3 -3.8 -2.4 -3.8 2.4 1 -4.3 -3.4 -3 4.4 -.4 Z" fill="${c}"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
    <ellipse cx="60" cy="68" rx="33" ry="42" fill="${egg.base}" stroke="#c9c2b4" stroke-width="2.5"/>
    ${deco}
    <ellipse cx="47" cy="42" rx="8" ry="12" fill="#ffffff" opacity="0.5" transform="rotate(-18 47 42)"/>
  </svg>`;
}
function eggDataURI(egg) {
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(eggSVG(egg));
}
function currentEgg() {
  return EGGS.find(e => e.id === state.egg) || EGGS[0];
}

function tasksOf(dateStr) {

    .filter(t => t.date === dateStr)

      : "いつでも";

        <div class="task-name">${escapeHtml(t.name)}</div>

      <button class="del-btn" aria-label="けす">✖</button>
    `;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ================= できた！ ================= */
function toggleTask(id, ev) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  if (!t.done) {
    const lvBefore = currentLevel();
    t.done = true;
    state.stars += 1;
    saveState();
    flyStar(ev.clientX, ev.clientY);
    confettiBurst(14);
    say(pickLine(CHEERS));
    renderChara("happy");
    setTimeout(() => renderChara("normal"), 1500);
    render();
    // レベルアップしたら せいちょうした すがたを おおきく みせる
    const lvAfter = currentLevel();
    if (lvAfter > lvBefore) queueOverlay(() => openLevelUp(lvAfter));
    // その日ぜんぶ完了なら おいわい
    const tasks = tasksOf(selectedDate);
    if (tasks.every(x => x.done) && !state.celebratedDates.includes(selectedDate)) {
      state.celebratedDates.push(selectedDate);
      saveState();
      queueOverlay(openCelebrate);
    }
    runOverlayQueue();
  } else {
    // まちがえてタップしたとき用：もどすと ほしも 1こ もどる
    t.done = false;
    state.stars = Math.max(0, state.stars - 1);
    const idx = state.celebratedDates.indexOf(selectedDate);
    if (idx >= 0) state.celebratedDates.splice(idx, 1);
    saveState();
    say("あれれ？ もういちど がんばろう！");
    render();
  }
}

function deleteTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`「${t.name}」を けしても いい？`)) return;
  state.tasks = state.tasks.filter(x => x.id !== id);
  saveState();
  render();
}

/* ================= タイマー ================= */
const TIMER_PRESETS = [
  { label: "1ぷん", sec: 60 },
  { label: "3ぷん", sec: 180 },
  { label: "5ふん", sec: 300 },
  { label: "10ぷん", sec: 600 },
  { label: "15ふん", sec: 900 },
];
let timerTotal = 300;      // えらんだ じかん（びょう）
let timerLeft = 300;       // のこり（びょう。小数OK）
let timerRunning = false;
let timerRAF = null;
let timerLastTs = 0;

function timerFmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}
function piePath(frac) {
  // frac: 1=まんたん, 0=から。12時から 時計回りに のこりを ぬる
  if (frac <= 0) return "";
  const f = Math.min(frac, 0.9999);
  const cx = 60, cy = 60, r = 54;
  const end = 360 * f;
  const a = (end - 90) * Math.PI / 180;
  const ex = cx + r * Math.cos(a), ey = cy + r * Math.sin(a);
  const large = end > 180 ? 1 : 0;
  return `M${cx},${cy} L${cx},${cy - r} A${r},${r} 0 ${large} 1 ${ex.toFixed(2)},${ey.toFixed(2)} Z`;
}
function timerRender() {
  const frac = timerTotal > 0 ? timerLeft / timerTotal : 0;
  const pie = document.getElementById("timer-pie");
  pie.setAttribute("d", piePath(frac));
  pie.classList.toggle("warn", timerLeft <= 10 && timerLeft > 0);
  document.getElementById("timer-digit").textContent = timerFmt(timerLeft);
}
function setTimerPreset(sec) {
  timerStop();
  timerTotal = sec;
  timerLeft = sec;
  document.querySelectorAll(".timer-preset").forEach(el => {
    el.classList.toggle("selected", Number(el.dataset.sec) === sec);
  });
  timerRender();
}
function buildTimerPresets() {
  const wrap = document.getElementById("timer-presets");
  wrap.innerHTML = "";
  for (const p of TIMER_PRESETS) {
    const b = document.createElement("button");
    b.className = "timer-preset";
    b.dataset.sec = p.sec;
    b.textContent = p.label;
    b.addEventListener("click", () => setTimerPreset(p.sec));
    wrap.appendChild(b);
  }
}
function timerTick(ts) {
  if (!timerRunning) return;
  if (!timerLastTs) timerLastTs = ts;
  const dt = (ts - timerLastTs) / 1000;
  timerLastTs = ts;
  timerLeft -= dt;
  if (timerLeft <= 0) {
    timerLeft = 0;
    timerRender();
    timerFinish();
    return;
  }
  timerRender();
  timerRAF = requestAnimationFrame(timerTick);
}
function timerStart() {
  if (timerLeft <= 0) timerLeft = timerTotal;
  timerRunning = true;
  timerLastTs = 0;
  document.getElementById("timer-start").textContent = "とめる";
  document.getElementById("timer-start").classList.add("running");
  timerRAF = requestAnimationFrame(timerTick);
}
function timerStop() {
  timerRunning = false;
  if (timerRAF) cancelAnimationFrame(timerRAF);
  document.getElementById("timer-start").textContent = "スタート";
  document.getElementById("timer-start").classList.remove("running");
}
function timerFinish() {
  timerStop();
  confettiBurst(30);
  beep();
  say("ピンポーン！ じかんだよ！");
}
/* おわりの おと（ファイル不要。Web Audioで ピピピ） */
function beep() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const notes = [880, 880, 1170];
    notes.forEach((freq, i) => {
      const t = ctx.currentTime + i * 0.22;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.22);
    });
    setTimeout(() => ctx.close(), 1200);
  } catch (e) { /* おとが だめでも つづける */ }
}

document.getElementById("timer-btn").addEventListener("click", () => {
  document.getElementById("timer-overlay").classList.add("open");
});
document.getElementById("timer-close").addEventListener("click", () => {
  timerStop();
  document.getElementById("timer-overlay").classList.remove("open");
});
document.getElementById("timer-start").addEventListener("click", () => {
  if (timerRunning) timerStop(); else timerStart();
});
document.getElementById("timer-reset").addEventListener("click", () => {
  timerStop();
  timerLeft = timerTotal;
  timerRender();
});

  const time = document.getElementById("task-time-input").value;
  if (!name) {
    say("かだいの なまえを えらんでね！");
    document.getElementById("task-name-input").focus();
    return;
  }
  if (!date) return;
  state.tasks.push({
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
    name, icon: modalIcon, date, time: time || null, done: false,
  });
  // はじめての かだいは つぎから えらべるように こうほに とうろく
  const known = PRESETS.some(p => p.name === name) || state.customPresets.some(p => p.name === name);
  if (!known) state.customPresets.unshift({ name, icon: modalIcon });
  // 未完了に戻るのでその日のおいわい記録をリセット
  const idx = state.celebratedDates.indexOf(date);
  if (idx >= 0) state.celebratedDates.splice(idx, 1);
  saveState();
  selectedDate = date;
  // 選んだ日が表示中の週になければ週を合わせる
  const target = parseDate(date);
  const base = new Date();
  base.setDate(base.getDate() - base.getDay());
  base.setHours(0, 0, 0, 0);
  weekOffset = Math.floor((target - base) / (7 * 24 * 3600 * 1000));
  closeModal();
  say("あたらしい かだいが できたよ！");
  render();
});

/* ================= へんしゅうモード ================= */
document.getElementById("edit-btn").addEventListener("click", () => {
  document.body.classList.toggle("edit-mode");
});

/* ================= さいしょから やりなおす ================= */
document.getElementById("reset-btn").addEventListener("click", () => {
  if (!confirm("ほんとうに さいしょから やりなおす？\nかだい・ほし・そだてた きろくが ぜんぶ きえるよ。")) return;
  if (!confirm("さいごの かくにんだよ。ほんとうに ぜんぶ けして いい？\nこの そうさは もとに もどせません。")) return;
  localStorage.removeItem(STORE_KEY);
  location.reload();
});

/* ================= 週送り ================= */
document.getElementById("prev-week").addEventListener("click", () => { weekOffset--; renderWeek(); });
document.getElementById("next-week").addEventListener("click", () => { weekOffset++; renderWeek(); });

/* ================= 全体描画 ================= */
function render() {
  renderChara();
  renderStars();
  renderWeek();
  renderTasks();
}

buildEggPicker();
buildModalChoices();
buildTimerPresets();
setTimerPreset(300);
say(pickLine(GREETINGS));
render();
if (!state.egg) document.getElementById("egg-overlay").classList.add("open");
</script>
