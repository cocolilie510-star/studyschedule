<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>がんばりスケジュール</title>
<style>
  :root {
    --bg: #f4f4f3;
    --card: #ffffff;
    --ink: #1f1f1e;
    --ink-soft: #4a4a48;
    --muted: #96968f;
    --line: #e8e8e5;
    --accent: #222220;
    --green: #6cb44c;
    --green-soft: #eef6e9;
    --gold: #e8a820;
    --gold-soft: #fdf3dd;
    --danger: #d05c5c;
    --shadow: 0 1px 2px rgba(20, 20, 18, 0.05), 0 4px 14px rgba(20, 20, 18, 0.06);
    --shadow-press: 0 1px 3px rgba(20, 20, 18, 0.08);
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--ink);
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  button { font-family: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  .app {
    max-width: 760px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px 16px 112px;
  }

  /* ===== ヘッダー（キャラクター） ===== */
  .header {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .chara-wrap {
    flex-shrink: 0;
    width: 128px;
    height: 128px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8f5f0;
    border: 1px solid var(--line);
    border-radius: 50%;
    overflow: hidden;
  }
  .chara {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.12);
    transform-origin: center;
    transition: transform 0.3s;
  }
  .chara.egg-fit { transform: none; }
  .chara.happy { animation: bounce 0.6s ease 2; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-12px) scale(1.05); }
    60% { transform: translateY(0) scale(0.97); }
  }
  .speech { flex: 1; min-width: 0; }
  .speech-text {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  .level-tag {
    display: inline-block;
    background: var(--gold-soft);
    color: #9a6c08;
    border-radius: 999px;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 12px;
    margin-top: 8px;
    letter-spacing: 0.03em;
  }

  /* ===== スター表示 ===== */
  .star-bar {
    margin-top: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .star-count {
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: baseline;
    gap: 5px;
    white-space: nowrap;
  }
  .star-count .num { font-size: 26px; color: var(--gold); }
  .level-progress { flex: 1; }
  .level-progress .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: bold; }
  .bar-outer {
    height: 10px;
    background: #ececea;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-inner {
    height: 100%;
    background: var(--gold);
    border-radius: 999px;
    width: 0%;
    transition: width 0.6s cubic-bezier(.34,1.56,.64,1);
  }

  /* ===== 日にち選択 ===== */
  .date-nav {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-arrow {
    width: 48px;
    height: 60px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    font-size: 16px;
    color: var(--muted);
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .date-arrow:active { transform: scale(0.94); box-shadow: var(--shadow-press); }
  .week-strip {
    flex: 1;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 2px;
  }
  .week-strip::-webkit-scrollbar { display: none; }
  .day-chip {
    flex: 1;
    min-width: 56px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 9px 4px 6px;
    text-align: center;
    transition: transform 0.15s;
  }
  .day-chip .dow { font-size: 11px; color: var(--muted); font-weight: bold; }
  .day-chip .dnum { font-size: 20px; font-weight: bold; margin-top: 1px; }
  .day-chip .dot { font-size: 9px; height: 14px; line-height: 14px; }
  .day-chip.selected {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.04);
  }
  .day-chip.selected .dow, .day-chip.selected .dnum { color: #fff; }
  .day-chip.today:not(.selected) { border-color: var(--ink-soft); }
  .day-chip.sat:not(.selected) .dow { color: #5b8db8; }
  .day-chip.sun:not(.selected) .dow { color: #c96f6f; }

  /* ===== 今日の見出し ===== */
  .day-heading {
    margin-top: 22px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 4px;
  }
  .day-heading h2 { font-size: 18px; letter-spacing: 0.02em; }
  .day-heading .done-count { font-size: 13px; color: var(--muted); font-weight: bold; }

  .day-progress { margin-top: 10px; padding: 0 4px; }
  .day-progress .bar-outer { height: 8px; }
  .day-progress .bar-inner { background: var(--green); }

  /* ===== タスクリスト ===== */
  .task-list {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .task-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    animation: slidein 0.3s ease;
    position: relative;
  }
  @keyframes slidein {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task-card.done { background: #fafaf9; }
  .task-card.done .task-name { text-decoration: line-through; color: var(--muted); }
  .task-card.done .task-icon { opacity: 0.5; }
  .task-icon {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    flex-shrink: 0;
  }
  .task-info { flex: 1; min-width: 0; }
  .task-time {
    font-size: 12px;
    font-weight: bold;
    color: var(--ink-soft);
    background: var(--bg);
    border: 1px solid var(--line);
    display: inline-block;
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 5px;
  }
  .task-time.no-time { color: var(--muted); }
  .task-name { font-size: 17px; font-weight: bold; word-break: break-word; line-height: 1.4; }
  .check-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--card);
    border: 2px dashed #d4d4d0;
    font-size: 26px;
    flex-shrink: 0;
    transition: transform 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check-btn:active { transform: scale(0.9); border-color: var(--green); }
  .task-card.done .check-btn {
    background: var(--green-soft);
    border: 2px solid var(--green);
    animation: pop 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop {
    0% { transform: scale(0.4); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .del-btn {
    position: absolute;
    top: -8px;
    right: -6px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--danger);
    font-size: 14px;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
  }
  body.edit-mode .del-btn { display: flex; }
  body.edit-mode .task-card { animation: wiggle 0.4s infinite; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(0.5deg); }
    75% { transform: rotate(-0.5deg); }
  }

  .empty-msg {
    text-align: center;
    padding: 44px 20px;
    color: var(--muted);
    font-size: 15px;
    font-weight: bold;
    line-height: 2;
  }
  .empty-msg .big { font-size: 40px; }

  /* ===== 下部ボタン ===== */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    pointer-events: none;
  }
  .bottom-bar > * { pointer-events: auto; }
  .add-btn {
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    border-radius: 999px;
    padding: 16px 36px;
    box-shadow: 0 6px 16px rgba(20, 20, 18, 0.28);
    transition: transform 0.15s;
    letter-spacing: 0.03em;
  }
  .add-btn:active { transform: scale(0.96); }
  .edit-btn {
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 14px;
    font-weight: bold;
    border-radius: 999px;
    padding: 16px 20px;
    box-shadow: var(--shadow);
    color: var(--muted);
  }
  body.edit-mode .edit-btn { background: var(--ink-soft); border-color: var(--ink-soft); color: #fff; }

  /* ===== モーダル ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(31, 31, 30, 0.5);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    width: 100%;
    max-width: 760px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 24px 24px 0 0;
    padding: 22px 20px calc(26px + env(safe-area-inset-bottom));
    animation: slideup 0.3s cubic-bezier(.34,1.3,.64,1);
  }
  @keyframes slideup {
    from { transform: translateY(60%); }
    to { transform: translateY(0); }
  }
  .modal h3 { font-size: 18px; text-align: center; margin-bottom: 6px; letter-spacing: 0.04em; }
  .modal-handle {
    width: 40px;
    height: 4px;
    background: #d8d8d4;
    border-radius: 999px;
    margin: 0 auto 16px;
  }
  .form-label {
    font-size: 13px;
    font-weight: bold;
    color: var(--ink-soft);
    margin: 18px 0 8px;
    display: block;
    letter-spacing: 0.03em;
  }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: bold;
    box-shadow: var(--shadow);
  }
  .chip.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
  .chip-del {
    display: inline-block;
    margin-left: 8px;
    color: var(--danger);
    font-size: 13px;
    padding: 2px 4px;
  }
  .chip.selected .chip-del { color: #fff; }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
    gap: 8px;
  }
  .icon-choice {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    font-size: 28px;
    padding: 10px 0 5px;
    text-align: center;
  }
  .icon-choice .icon-label { font-size: 10px; color: var(--muted); display: block; font-weight: bold; }
  .icon-choice.selected { border: 2px solid var(--accent); background: #f7f7f5; }
  .text-input, .time-input, .date-input {
    width: 100%;
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    outline: none;
  }
  .text-input:focus, .time-input:focus, .date-input:focus { border-color: var(--accent); }
  .time-row { display: flex; gap: 8px; align-items: center; }
  .time-row .time-input { flex: 1; }
  .time-clear {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 13px 14px;
    font-size: 13px;
    font-weight: bold;
    color: var(--muted);
    white-space: nowrap;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 26px; }
  .btn-cancel {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
    color: var(--muted);
    box-shadow: var(--shadow);
  }
  .btn-save {
    flex: 2;
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 6px 16px rgba(20, 20, 18, 0.28);
    letter-spacing: 0.03em;
  }
  .btn-save:active { transform: scale(0.97); }
  .btn-save:disabled { opacity: 0.4; }

  /* ===== おいわい ===== */
  .celebrate-overlay {
    position: fixed;
    inset: 0;
    background: rgba(250, 250, 249, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    padding: 24px;
  }
  .celebrate-overlay.open { display: flex; }
  .celebrate-chara {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: #f8f5f0;
    border: 1px solid var(--line);
    object-fit: cover;
    animation: bounce 0.7s ease infinite;
  }
  .celebrate-title { font-size: 30px; font-weight: bold; letter-spacing: 0.05em; }
  .celebrate-sub { font-size: 16px; font-weight: bold; line-height: 1.9; color: var(--ink-soft); }
  .celebrate-close {
    margin-top: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    border-radius: 999px;
    padding: 15px 44px;
    box-shadow: 0 6px 16px rgba(20, 20, 18, 0.28);
  }

  /* レベルアップ */
  .levelup-img {
    width: min(72vw, 330px);
    aspect-ratio: 1;
    border-radius: 28px;
    border: 1px solid var(--line);
    background: #f8f5f0;
    object-fit: cover;
    animation: pop 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .levelup-name {
    font-size: 22px;
    font-weight: bold;
    background: var(--gold-soft);
    color: #9a6c08;
    border-radius: 999px;
    padding: 6px 22px;
  }

  /* たまごえらび */
  .egg-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 24px;
    text-align: center;
    overflow-y: auto;
  }
  .egg-overlay.open { display: flex; }
  .egg-overlay h3 { font-size: 22px; letter-spacing: 0.04em; }
  .egg-lead { font-size: 14px; color: var(--muted); font-weight: bold; margin-bottom: 16px; line-height: 1.8; }
  .egg-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    max-width: 560px;
  }
  .egg-choice {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 14px 10px 12px;
    width: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: transform 0.15s;
  }
  .egg-choice:active { transform: scale(0.94); }
  .egg-choice svg { width: 104px; height: 104px; }
  .egg-name { font-size: 14px; font-weight: bold; }

  /* 紙吹雪 */
  .confetti {
    position: fixed;
    top: -20px;
    font-size: 22px;
    z-index: 99;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }

  /* +1 ほし */
  .fly-star {
    position: fixed;
    font-size: 26px;
    font-weight: bold;
    color: var(--gold);
    z-index: 99;
    pointer-events: none;
    animation: flyup 0.9s ease forwards;
  }
  @keyframes flyup {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to { transform: translateY(-90px) scale(1.4); opacity: 0; }
  }

  @media (min-width: 600px) {
    .chara-wrap { width: 160px; height: 160px; }
    .speech-text { font-size: 17px; }
    .task-name { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- キャラクター -->
  <div class="header">
    <div class="chara-wrap"><img id="chara" class="chara" alt="ヤモちゃん"></div>
    <div class="speech">
      <div class="speech-text" id="speech-text">きょうも いっしょに がんばろう！</div>
      <span class="level-tag" id="level-tag">レベル1 たまごヤモ</span>
    </div>
  </div>

  <!-- ほし＆レベル -->
  <div class="star-bar">
    <div class="star-count">⭐ <span class="num" id="star-num">0</span> こ</div>
    <div class="level-progress">
      <div class="label" id="level-label">つぎのレベルまで あと 5こ</div>
      <div class="bar-outer"><div class="bar-inner" id="level-bar"></div></div>
    </div>
  </div>

  <!-- 日にちナビ -->
  <div class="date-nav">
    <button class="date-arrow" id="prev-week" aria-label="まえのしゅう">◀</button>
    <div class="week-strip" id="week-strip"></div>
    <button class="date-arrow" id="next-week" aria-label="つぎのしゅう">▶</button>
  </div>

  <!-- 見出し＆きょうのすすみぐあい -->
  <div class="day-heading">
    <h2 id="day-title">きょうの かだい</h2>
    <span class="done-count" id="done-count"></span>
  </div>
  <div class="day-progress">
    <div class="bar-outer"><div class="bar-inner" id="day-bar"></div></div>
  </div>

  <!-- かだいリスト -->
  <div class="task-list" id="task-list"></div>
</div>

<!-- 下部ボタン -->
<div class="bottom-bar">
  <button class="edit-btn" id="edit-btn">✏️ へんしゅう</button>
  <button class="add-btn" id="add-btn">＋ かだいを ふやす</button>
</div>

<!-- 追加モーダル -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>あたらしい かだい</h3>

    <label class="form-label">① なにを やる？（えらんでね）</label>
    <div class="chip-grid" id="preset-chips"></div>

    <label class="form-label">じぶんで かくときは ここ ✍️</label>
    <input type="text" class="text-input" id="task-name-input" maxlength="30" placeholder="れい：かんじドリル 2ページ">

    <label class="form-label">② マークを えらぼう</label>
    <div class="icon-grid" id="icon-grid"></div>

    <label class="form-label">③ いつ やる？</label>
    <input type="date" class="date-input" id="task-date-input">

    <label class="form-label">④ なんじから？（なくても OK）</label>
    <div class="time-row">
      <input type="time" class="time-input" id="task-time-input">
      <button class="time-clear" id="time-clear">じかんなし</button>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">やめる</button>
      <button class="btn-save" id="btn-save">これで きめた！</button>
    </div>
  </div>
</div>

<!-- レベルアップ おいわい -->
<div class="celebrate-overlay" id="levelup-overlay">
  <img class="levelup-img" id="levelup-img" alt="せいちょうした ヤモちゃん">
  <div class="celebrate-title">✨ レベルアップ！ ✨</div>
  <div class="levelup-name" id="levelup-name"></div>
  <div class="celebrate-sub" id="levelup-sub"></div>
  <button class="celebrate-close" id="levelup-close">やったー！</button>
</div>

<!-- たまごえらび（さいしょの1かい） -->
<div class="egg-overlay" id="egg-overlay">
  <h3>すきな たまごを えらんでね</h3>

"use strict";

/* ================= データ ================= */
const STORE_KEY = "studyschedule-v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* こわれたデータは無視 */ }
  return { tasks: [], stars: 0, celebratedDates: [] };
}
function saveState() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
const state = loadState();
if (!Array.isArray(state.tasks)) state.tasks = [];
if (typeof state.stars !== "number") state.stars = 0;
if (!Array.isArray(state.celebratedDates)) state.celebratedDates = [];
if (!Array.isArray(state.customPresets)) state.customPresets = [];
if (!state.egg) state.egg = null;

/* ================= 日付ユーティリティ ================= */
const DOW = ["にち", "げつ", "か", "すい", "もく", "きん", "ど"];
function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
}
function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
const todayStr = fmtDate(new Date());

    deco = `<path d="M52 54 a5 5 0 0 1 8 0 a5 5 0 0 1 8 0 q0 6 -8 12 q-8 -6 -8 -12" fill="${c}"/>
      <path d="M40 80 a3.5 3.5 0 0 1 5.5 0 a3.5 3.5 0 0 1 5.5 0 q0 4 -5.5 8.5 q-5.5 -4.5 -5.5 -8.5" fill="${c}"/>
      <path d="M68 84 a3 3 0 0 1 5 0 a3 3 0 0 1 5 0 q0 4 -5 7.5 q-5 -3.5 -5 -7.5" fill="${c}"/>`;
  } else if (egg.deco === "stars") {
    deco = `<path d="M60 44 l2.8 6.4 6.8 .5 -5.2 4.6 1.6 6.6 -6 -3.6 -6 3.6 1.6 -6.6 -5.2 -4.6 6.8 -.5 Z" fill="${c}"/>
      <path d="M44 76 l1.8 4.2 4.4 .4 -3.4 3 1 4.3 -3.8 -2.4 -3.8 2.4 1 -4.3 -3.4 -3 4.4 -.4 Z" fill="${c}"/>
      <path d="M76 82 l1.8 4.2 4.4 .4 -3.4 3 1 4.3 -3.8 -2.4 -3.8 2.4 1 -4.3 -3.4 -3 4.4 -.4 Z" fill="${c}"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
    <ellipse cx="60" cy="68" rx="33" ry="42" fill="${egg.base}" stroke="#c9c2b4" stroke-width="2.5"/>
    ${deco}
    <ellipse cx="47" cy="42" rx="8" ry="12" fill="#ffffff" opacity="0.5" transform="rotate(-18 47 42)"/>
  </svg>`;
}
function eggDataURI(egg) {
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(eggSVG(egg));
}
function currentEgg() {
  return EGGS.find(e => e.id === state.egg) || EGGS[0];
}

/* ================= キャラクターずかん =================
   うまれる いきものは ここに ついかするだけで ふやせます。
   - name   : ずかんの なまえ
   - nick   : セリフで つかう よびな（「{nick}も うれしいよ〜！」など）
   - stages : せいちょうの だんかい（need = ひつような ほしの数、
              img = 画像。data URI でも "assets/xxx.png" のような
              ファイルパスでも OK。だんかいの数は じゆう）
   たまご（EGGS）の species に キーを かくと、そのたまごから うまれます。
   画像を SPECIES_IMG に 埋めこまず、ファイルパスを かいても OK です。 */
const SPECIES = {
  yamori: {
    name: "クロヤモリ",
    nick: "ヤモちゃん",
    stages: [
      { need: 3,  name: "うまれたてヤモ", img: SPECIES_IMG.yamori[0] },
      { need: 12, name: "こどもヤモ",     img: SPECIES_IMG.yamori[1] },
      { need: 25, name: "おとなヤモ",     img: SPECIES_IMG.yamori[2] },
      { need: 45, name: "ママヤモ",       img: SPECIES_IMG.yamori[3] },
    ],
  },
  highyellow: {
    name: "ハイイエローレオパ",
    nick: "レオちゃん",
    stages: [
      { need: 3,  name: "うまれたてレオ", img: SPECIES_IMG.highyellow[0] },
      { need: 12, name: "こどもレオ",     img: SPECIES_IMG.highyellow[1] },
      { need: 25, name: "おとなレオ",     img: SPECIES_IMG.highyellow[2] },
      { need: 45, name: "ママレオ",       img: SPECIES_IMG.highyellow[3] },
    ],
  },
  tangerine: {
    name: "タンジェリンレオパ",
    nick: "タンちゃん",
    stages: [
      { need: 3,  name: "うまれたてタン", img: SPECIES_IMG.tangerine[0] },
      { need: 12, name: "こどもタン",     img: SPECIES_IMG.tangerine[1] },
      { need: 25, name: "おとなタン",     img: SPECIES_IMG.tangerine[2] },
      { need: 45, name: "ママタン",       img: SPECIES_IMG.tangerine[3] },
    ],
  },
  seaturtle: {
    name: "アオウミガメ",
    nick: "カメちゃん",
    stages: [
      { need: 3,  name: "うまれたてカメ", img: SPECIES_IMG.seaturtle[0] },
      { need: 12, name: "こどもカメ",     img: SPECIES_IMG.seaturtle[1] },
      { need: 25, name: "おとなカメ",     img: SPECIES_IMG.seaturtle[2] },
      { need: 45, name: "ママガメ",       img: SPECIES_IMG.seaturtle[3] },
    ],
  },
  snake: {
    name: "ミドリヘビ",
    nick: "ヘビちゃん",
    stages: [
      { need: 3,  name: "うまれたてヘビ", img: SPECIES_IMG.snake[0] },
      { need: 12, name: "こどもヘビ",     img: SPECIES_IMG.snake[1] },
      { need: 25, name: "おとなヘビ",     img: SPECIES_IMG.snake[2] },
      { need: 45, name: "ママヘビ",       img: SPECIES_IMG.snake[3] },
    ],
  },
};
function currentSpecies() {
  return SPECIES[currentEgg().species] || SPECIES.yamori;
}

/* ================= レベル ================= */
function getLevels() {
  const egg = currentEgg();
  const sp = currentSpecies();
  return [
    { need: 0, name: egg.name, img: eggDataURI(egg), fit: "contain" },
    ...sp.stages,
  ];
}
function currentLevel() {
  const LV = getLevels();
  let lv = 0;
  for (let i = 0; i < LV.length; i++) {
    if (state.stars >= LV[i].need) lv = i;
  }
  return lv;
}

function renderChara(mood = "normal") {
  const LV = getLevels();
  const lv = currentLevel();
  const img = document.getElementById("chara");
  img.src = LV[lv].img;
  img.classList.toggle("egg-fit", LV[lv].fit === "contain");
  img.classList.toggle("happy", mood === "happy");
  document.getElementById("level-tag").textContent = `レベル${lv + 1} ${LV[lv].name}`;
}

/* ================= ほし＆レベル表示 ================= */
function renderStars(animate) {
  const LV = getLevels();
  const lv = currentLevel();
  document.getElementById("star-num").textContent = state.stars;
  const next = LV[lv + 1];
  const bar = document.getElementById("level-bar");
  const label = document.getElementById("level-label");
  if (next) {
    const prev = LV[lv].need;
    const pct = ((state.stars - prev) / (next.need - prev)) * 100;
    bar.style.width = pct + "%";
    label.textContent = `つぎのレベルまで あと ${next.need - state.stars}こ`;
  } else {
    bar.style.width = "100%";
    label.textContent = "さいこうレベル！ すごすぎる！";
  }
}

/* ================= セリフ ================= */
/* {nick} は そだてている いきものの よびなに おきかわります */
const CHEERS = [
  "やったね！ すごい！",
  "その ちょうし！",
  "てんさい かも！？",
  "がんばったね！ えらい！",
  "ピカピカの ほしを ゲット！",
  "{nick}も うれしいよ〜！",
  "かっこいい！ つぎも いこう！",
];
const GREETINGS = [
  "きょうも いっしょに がんばろう！",
  "どの かだいから やる？",
  "{nick}は きみを おうえんしてるよ！",
];
function pickLine(lines) {
  const line = lines[Math.floor(Math.random() * lines.length)];
  return line.replaceAll("{nick}", currentSpecies().nick);
}
function say(text) {
  document.getElementById("speech-text").textContent = text;
}

/* ================= 週ストリップ ================= */
function renderWeek() {
  const strip = document.getElementById("week-strip");
  strip.innerHTML = "";
  const base = new Date();
  base.setDate(base.getDate() - base.getDay() + weekOffset * 7); // 日曜はじまり
  for (let i = 0; i < 7; i++) {
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    const ds = fmtDate(d);
    const chip = document.createElement("button");
    chip.className = "day-chip";
    if (i === 0) chip.classList.add("sun");
    if (i === 6) chip.classList.add("sat");
    if (ds === todayStr) chip.classList.add("today");
    if (ds === selectedDate) chip.classList.add("selected");
    const dayTasks = state.tasks.filter(t => t.date === ds);
    const doneAll = dayTasks.length > 0 && dayTasks.every(t => t.done);
    const dot = dayTasks.length === 0 ? "" : doneAll ? "⭐" : "●";
    chip.innerHTML = `<div class="dow">${DOW[d.getDay()]}</div><div class="dnum">${d.getDate()}</div><div class="dot" style="color:${doneAll ? "var(--gold)" : "var(--muted)"}">${dot}</div>`;
    chip.addEventListener("click", () => { selectedDate = ds; render(); });
    strip.appendChild(chip);
  }
}

/* ================= タスクリスト ================= */
function tasksOf(dateStr) {
  return state.tasks
    .filter(t => t.date === dateStr)
    .sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
}

function renderTasks() {
  const list = document.getElementById("task-list");
  list.innerHTML = "";
  const tasks = tasksOf(selectedDate);

  const d = parseDate(selectedDate);
  const title = selectedDate === todayStr
    ? "きょうの かだい"
    : `${d.getMonth() + 1}がつ${d.getDate()}にち（${DOW[d.getDay()]}）の かだい`;
  document.getElementById("day-title").textContent = title;

  const doneN = tasks.filter(t => t.done).length;
  document.getElementById("done-count").textContent =
    tasks.length ? `${doneN} / ${tasks.length} できた` : "";
  document.getElementById("day-bar").style.width =
    tasks.length ? (doneN / tasks.length) * 100 + "%" : "0%";

  if (tasks.length === 0) {
    list.innerHTML = `<div class="empty-msg"><div class="big">🦎</div>まだ かだいが ないよ<br>「＋ かだいを ふやす」で つくってみよう！</div>`;
    return;
  }

  for (const t of tasks) {
    const card = document.createElement("div");
    card.className = "task-card" + (t.done ? " done" : "");
    const timeLabel = t.time
      ? `${parseInt(t.time.split(":")[0], 10)}じ${t.time.split(":")[1] !== "00" ? parseInt(t.time.split(":")[1], 10) + "ふん" : ""}から`
      : "いつでも";
    card.innerHTML = `
      <div class="task-icon">${t.icon}</div>
      <div class="task-info">
        <span class="task-time ${t.time ? "" : "no-time"}">🕐 ${timeLabel}</span>
        <div class="task-name">${escapeHtml(t.name)}</div>
      </div>
      <button class="check-btn" aria-label="できた">${t.done ? "⭐" : ""}</button>
      <button class="del-btn" aria-label="けす">✖</button>
    `;
    card.querySelector(".check-btn").addEventListener("click", (ev) => toggleTask(t.id, ev));
    card.querySelector(".del-btn").addEventListener("click", () => deleteTask(t.id));
    list.appendChild(card);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ================= できた！ ================= */
function toggleTask(id, ev) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  if (!t.done) {
    const lvBefore = currentLevel();
    t.done = true;
    state.stars += 1;
    saveState();
    flyStar(ev.clientX, ev.clientY);
    confettiBurst(14);
    say(pickLine(CHEERS));
    renderChara("happy");
    setTimeout(() => renderChara("normal"), 1500);
    render();
    // レベルアップしたら せいちょうした すがたを おおきく みせる
    const lvAfter = currentLevel();
    if (lvAfter > lvBefore) queueOverlay(() => openLevelUp(lvAfter));
    // その日ぜんぶ完了なら おいわい
    const tasks = tasksOf(selectedDate);
    if (tasks.every(x => x.done) && !state.celebratedDates.includes(selectedDate)) {
      state.celebratedDates.push(selectedDate);
      saveState();
      queueOverlay(openCelebrate);
    }
    runOverlayQueue();
  } else {
    // まちがえてタップしたとき用：もどすと ほしも 1こ もどる
    t.done = false;
    state.stars = Math.max(0, state.stars - 1);
    const idx = state.celebratedDates.indexOf(selectedDate);
    if (idx >= 0) state.celebratedDates.splice(idx, 1);
    saveState();
    say("あれれ？ もういちど がんばろう！");
    render();
  }
}

function deleteTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`「${t.name}」を けしても いい？`)) return;
  state.tasks = state.tasks.filter(x => x.id !== id);
  saveState();
  render();
}

/* ================= エフェクト ================= */
function confettiBurst(n) {
  const emojis = ["✨", "⭐", "🌟", "💫", "🎉"];
  for (let i = 0; i < n; i++) {
    const el = document.createElement("div");
    el.className = "confetti";
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = 1.2 + Math.random() * 1.4 + "s";
    el.style.fontSize = 16 + Math.random() * 16 + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
}
function flyStar(x, y) {
  const el = document.createElement("div");
  el.className = "fly-star";
  el.textContent = "⭐ +1";
  el.style.left = (x - 30) + "px";
  el.style.top = (y - 20) + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

/* ================= おいわい ================= */
/* お祝い画面がかさなったとき用の順番待ち */
const overlayQueue = [];
let overlayShowing = false;
function queueOverlay(fn) { overlayQueue.push(fn); }
function runOverlayQueue() {
  if (overlayShowing) return;
  const fn = overlayQueue.shift();
  if (!fn) return;
  overlayShowing = true;
  setTimeout(fn, 500);
}
function overlayClosed() {
  overlayShowing = false;
  runOverlayQueue();
}

function openCelebrate() {
  const LV = getLevels();
  const lv = currentLevel();
  document.getElementById("celebrate-chara").src = LV[lv].img;
  document.getElementById("celebrate-overlay").classList.add("open");
  confettiBurst(40);
}
document.getElementById("celebrate-close").addEventListener("click", () => {
  document.getElementById("celebrate-overlay").classList.remove("open");
  overlayClosed();
});

function openLevelUp(lv) {
  const LV = getLevels();
  document.getElementById("levelup-img").src = LV[lv].img;
  document.getElementById("levelup-name").textContent = LV[lv].name;
  document.getElementById("levelup-sub").innerHTML = lv === 1
    ? "たまごから うまれた！<br>これからも いっしょに がんばろう！"
    : "おおきく せいちょうした！<br>このちょうしで がんばろう！";
  document.getElementById("levelup-overlay").classList.add("open");
  confettiBurst(44);
}
document.getElementById("levelup-close").addEventListener("click", () => {
  document.getElementById("levelup-overlay").classList.remove("open");
  overlayClosed();
});

/* ================= たまごえらび ================= */
function buildEggPicker() {
  const grid = document.getElementById("egg-grid");
  grid.innerHTML = "";
  for (const egg of EGGS) {
    const b = document.createElement("button");
    b.className = "egg-choice";
    b.innerHTML = `${eggSVG(egg)}<span class="egg-name">${egg.name}</span>`;
    b.addEventListener("click", () => {
      state.egg = egg.id;
      saveState();
      document.getElementById("egg-overlay").classList.remove("open");
      say(`${egg.name}を えらんだ！ かだいを クリアして そだてよう！`);
      confettiBurst(20);
      render();
    });
    grid.appendChild(b);
  }
}

/* ================= 追加モーダル ================= */
const PRESETS = [
  { name: "こくごの しゅくだい", icon: "📖" },
  { name: "さんすうの しゅくだい", icon: "🔢" },
  { name: "かんじの れんしゅう", icon: "✏️" },
  { name: "けいさんドリル", icon: "🧮" },
  { name: "おんどく", icon: "🗣️" },
  { name: "にっき を かく", icon: "📔" },
  { name: "ピアノの れんしゅう", icon: "🎹" },
  { name: "ほんを よむ", icon: "📚" },
];
const ICONS = [
  { icon: "📖", label: "こくご" },
  { icon: "🔢", label: "さんすう" },
  { icon: "✏️", label: "かく" },
  { icon: "📚", label: "どくしょ" },
  { icon: "🗣️", label: "おんどく" },
  { icon: "🎹", label: "おんがく" },
  { icon: "🏃", label: "うんどう" },
  { icon: "🎨", label: "ずこう" },
  { icon: "🔬", label: "りか" },
  { icon: "🌏", label: "せいかつ" },
  { icon: "💻", label: "パソコン" },
  { icon: "🧹", label: "おてつだい" },
];
let modalIcon = ICONS[0].icon;

function buildModalChoices() {
  const presetWrap = document.getElementById("preset-chips");
  presetWrap.innerHTML = "";
  const addChip = (p, isCustom) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.dataset.name = p.name;
    b.appendChild(document.createTextNode(`${p.icon} ${p.name}`));
    if (isCustom) {
      // じぶんで つくった かだいは ✕で こうほから けせる
      const x = document.createElement("span");
      x.className = "chip-del";
      x.textContent = "✕";
      x.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (!confirm(`「${p.name}」を こうほから けしても いい？`)) return;
        state.customPresets = state.customPresets.filter(cp => cp.name !== p.name);
        saveState();
        buildModalChoices();
        updateModalSelection();
      });
      b.appendChild(x);
    }
    b.addEventListener("click", () => {
      document.getElementById("task-name-input").value = p.name;
      modalIcon = p.icon;
      updateModalSelection();
    });
    presetWrap.appendChild(b);
  };
  for (const p of PRESETS) addChip(p, false);
  for (const p of state.customPresets) addChip(p, true);
  const iconWrap = document.getElementById("icon-grid");
  iconWrap.innerHTML = "";
  for (const ic of ICONS) {
    const b = document.createElement("button");
    b.className = "icon-choice";
    b.dataset.icon = ic.icon;
    b.innerHTML = `${ic.icon}<span class="icon-label">${ic.label}</span>`;
    b.addEventListener("click", () => { modalIcon = ic.icon; updateModalSelection(); });
    iconWrap.appendChild(b);
  }
}
function updateModalSelection() {
  document.querySelectorAll(".icon-choice").forEach(el => {
    el.classList.toggle("selected", el.dataset.icon === modalIcon);
  });
  const name = document.getElementById("task-name-input").value.trim();
  document.querySelectorAll("#preset-chips .chip").forEach(el => {
    el.classList.toggle("selected", el.dataset.name === name && name !== "");
  });
}

function openModal() {
  buildModalChoices();
  document.getElementById("task-name-input").value = "";
  document.getElementById("task-date-input").value = selectedDate;
  document.getElementById("task-time-input").value = "";
  modalIcon = ICONS[0].icon;
  updateModalSelection();
  document.getElementById("modal-overlay").classList.add("open");
}
function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
}

document.getElementById("add-btn").addEventListener("click", openModal);
document.getElementById("btn-cancel").addEventListener("click", closeModal);
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target === document.getElementById("modal-overlay")) closeModal();
});
document.getElementById("time-clear").addEventListener("click", () => {
  document.getElementById("task-time-input").value = "";
});
document.getElementById("task-name-input").addEventListener("input", updateModalSelection);

document.getElementById("btn-save").addEventListener("click", () => {
  const name = document.getElementById("task-name-input").value.trim();
  const date = document.getElementById("task-date-input").value;
  const time = document.getElementById("task-time-input").value;
  if (!name) {
    say("かだいの なまえを えらんでね！");
    document.getElementById("task-name-input").focus();
    return;
  }
  if (!date) return;
  state.tasks.push({
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
    name, icon: modalIcon, date, time: time || null, done: false,
  });
  // はじめての かだいは つぎから えらべるように こうほに とうろく
  const known = PRESETS.some(p => p.name === name) || state.customPresets.some(p => p.name === name);
  if (!known) state.customPresets.push({ name, icon: modalIcon });
  // 未完了に戻るのでその日のおいわい記録をリセット
  const idx = state.celebratedDates.indexOf(date);
  if (idx >= 0) state.celebratedDates.splice(idx, 1);
  saveState();
  selectedDate = date;
  // 選んだ日が表示中の週になければ週を合わせる
  const target = parseDate(date);
  const base = new Date();
  base.setDate(base.getDate() - base.getDay());
  base.setHours(0, 0, 0, 0);
  weekOffset = Math.floor((target - base) / (7 * 24 * 3600 * 1000));
  closeModal();
  say("あたらしい かだいが できたよ！");
  render();
});

/* ================= へんしゅうモード ================= */
document.getElementById("edit-btn").addEventListener("click", () => {
  document.body.classList.toggle("edit-mode");
});

/* ================= 週送り ================= */
document.getElementById("prev-week").addEventListener("click", () => { weekOffset--; renderWeek(); });
document.getElementById("next-week").addEventListener("click", () => { weekOffset++; renderWeek(); });

/* ================= 全体描画 ================= */
function render() {
  renderChara();
  renderStars();
  renderWeek();
  renderTasks();
}

buildEggPicker();
buildModalChoices();
say(pickLine(GREETINGS));
render();
if (!state.egg) document.getElementById("egg-overlay").classList.add("open");
</script>
